[package]
name = "yuriengine-inspection"
version = "0.1.0"
edition = "2021"

[lib]
name = "yuriengine"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "1.0.1"
pyo3 = "0.30.1"
imgui = "0.12"
imgui-wgpu = "0.28"
imgui-winit-support = "0.13"
png = "0.17"
wgpu = "29"
winit = "0.30"
ufbx = "0.11.5"
