[package]
name = "yuriengine-inspection"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "1.0.1"
png = "0.17"
wgpu = { version = "29", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "metal",
    "gles",
    "vulkan",
    "wgsl",
    "webgl",
] }
ufbx = "0.11.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
imgui = "0.12"
imgui-wgpu = "0.28"
imgui-winit-support = "0.13"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
