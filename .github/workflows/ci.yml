name: SwapChain CI

on:
  push:
    branches: ["Inspection/001", "Render/SwapChain", "Render/TriangleDemo"]
  pull_request:
    branches: ["Inspection/001", "Render/SwapChain", "Render/TriangleDemo"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build release executable
        run: cargo build --locked --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: yuriengine-windows-x86_64
          path: target/release/yuriengine-inspection.exe
          if-no-files-found: error

  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev xvfb
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --fix --allow-dirty --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build
        run: cargo build --locked
      - name: Present frames (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --locked -- --smoke-frames=5
      - name: Present frames (Windows and macOS)
        if: runner.os != 'Linux'
        run: cargo run --locked -- --smoke-frames=5
