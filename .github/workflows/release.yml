name: SwapChain Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: yuriengine-windows-x64
            executable: yuriengine-inspection.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: yuriengine-linux-x64
            executable: yuriengine-inspection
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: yuriengine-macos-arm64
            executable: yuriengine-inspection

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev xvfb
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release executable
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package executable
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.asset }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes
