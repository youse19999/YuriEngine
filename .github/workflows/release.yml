name: SwapChain Release

on:
  push:
    branches:
      - "Render/SwapChain"
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: yuriengine-windows-x64
            executable: yuriengine-inspection.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: yuriengine-linux-x64
            executable: yuriengine-inspection
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: yuriengine-macos-arm64
            executable: yuriengine-inspection

    steps:
      - uses: actions/checkout@v5
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev xvfb
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release executable
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package executable
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.asset }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          files = sorted(path for path in Path("dist").iterdir() if path.is_file())
          sums_path = Path("dist") / "${{ matrix.asset }}-SHA256SUMS.txt"
          with sums_path.open("w", encoding="utf-8") as sums:
              for path in files:
                  sums.write(f"{sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes
