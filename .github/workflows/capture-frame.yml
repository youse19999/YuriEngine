name: Capture Rendered Frame

on:
  push:
    branches: [main, "Render/**"]
  pull_request:
    branches: [main, "Render/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install headless Vulkan renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers
      - name: Build the renderer
        run: cargo build --locked
      - name: Render and capture a frame
        run: target/debug/yuriengine-inspection --capture-frame=rendered-frame.png
      - name: Upload rendered frame
        uses: actions/upload-artifact@v4
        with:
          name: yuriengine-rendered-frame
          path: rendered-frame.png
          if-no-files-found: error
          retention-days: 14
